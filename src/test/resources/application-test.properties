# Server Configuration
server.port=8080

# MongoDB Test Configuration - Embedded MongoDB
# The embedded MongoDB will be automatically started by de.flapdoodle.embed.mongo dependency
spring.data.mongodb.database=test_ace_transformer
spring.data.mongodb.auto-index-creation=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging Configuration
logging.level.com.bny.ace.transformer=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.data.mongodb=DEBUG
logging.level.de.flapdoodle.embed.mongo=INFO
