# Server Configuration
server.port=8080
server.servlet.context-path=/

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/ace_transformer
spring.data.mongodb.database=ace_transformer
# Auto-create indexes based on @Indexed annotations
spring.data.mongodb.auto-index-creation=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Application Configuration
app.name=Universal Data Transformer
app.version=1.0.0
app.description=Universal data transformation application supporting JSON, XML, CSV, and TXT formats

# Logging Configuration
logging.level.com.bny.ace.transformer=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.data.mongodb=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
